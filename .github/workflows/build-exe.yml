name: Build EXE

on:
  push:
    branches: [ "main" ]   # 当代码推送到 main 分支时自动运行
  workflow_dispatch:       # 同时启用 GitHub 网页上的手动触发按钮

jobs:
  build:
    runs-on: windows-latest  # 打包 exe 必须在 Windows 环境中进行

    steps:
    # 1. 拉取你的代码
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. 设置 Python 环境 (并开启缓存加速)
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'  # 设置你的 Python 版本
        cache: 'pip'            # 开启 pip 依赖缓存

    # 3. 安装依赖
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      shell: bash

    # 4. 执行 PyInstaller 打包
    - name: Build with PyInstaller
      run: |
        # 如果是 GUI 程序，加上 --noconsole 参数；如果要单文件，加上 -F
        pyinstaller -F --noconsole --name "Windows Control" Main.py

    # 5. 上传生成的 exe 文件
    - name: Upload EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: MyApp-Windows
        path: dist/*.exe   # 打包后的 exe 通常在 dist 文件夹下
